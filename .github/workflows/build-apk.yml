
name: Build Vythora AI APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Arrange files wherever they were uploaded
        run: |
          mkdir -p www scripts
          [ -f www/index.html ] || cp "$(find . -name index.html | head -1)" www/index.html
          for f in make_icons.py patch_android.py; do [ -f scripts/$f ] || cp "$(find . -name $f | head -1)" scripts/$f; done
      - name: Add public Supabase settings
        env:
          SB_URL: ${{ vars.SB_URL }}
          SB_KEY: ${{ vars.SB_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then echo "::error::Add repository variables SB_URL and SB_KEY"; exit 1; fi
          sed -i "s|YOUR_SUPABASE_URL|$SB_URL|g; s|YOUR_SUPABASE_ANON_KEY|$SB_KEY|g" www/index.html
      - run: npm install
      - run: mkdir -p www/vendor && cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/vendor/supabase.js
      - run: pip install pillow && python3 scripts/make_icons.py
      - run: npx cap add android
      - run: python3 scripts/patch_android.py
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: vythora-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
